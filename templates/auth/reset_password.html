{% extends 'base.html' %}

{% block title %}Set New Password - Personal Expense Tracker{% endblock %}

{% block content %}
<div class="container container-sm">
    <div class="card" style="margin-top: 2rem;">
        <div class="card-header" style="justify-content: center; text-align: center; border-bottom: none; margin-bottom: 0.5rem;">
            <div>
                <h2 class="card-title" style="font-size: 1.5rem;">Set New Password</h2>
                {% if email %}
                    <p style="color: var(--gray-500); font-size: 0.9rem; margin-top: 0.25rem;">Account: <strong>{{ email }}</strong></p>
                {% endif %}
            </div>
        </div>

        <form method="POST" action="{{ url_for('reset_password', token=token) }}">
            <div class="form-group">
                <label for="password" class="form-label">New Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Minimum 6 characters" required autofocus>
            </div>

            <div class="form-group">
                <label for="confirm_password" class="form-label">Confirm New Password</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Re-enter new password" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block" style="margin-top: 0.5rem;">Update Password</button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--gray-100); font-size: 0.9rem;">
            <a href="{{ url_for('login') }}">Back to Login</a>
        </div>
    </div>
</div>
{% endblock %}

{% extends 'base.html' %}

{% block title %}Add New Expense - Personal Expense Tracker{% endblock %}

{% block content %}
<div class="container container-sm">
    <div style="margin-bottom: 1rem;">
        <a href="{{ url_for('expense_list') }}" style="font-size: 0.9rem; color: var(--gray-600);">&larr; Back to Expenses</a>
    </div>

    <div class="card">
        <div class="card-header">
            <h2 class="card-title">➕ Add New Expense</h2>
        </div>

        <form method="POST" action="{{ url_for('add_expense_route') }}">
            <div class="form-group">
                <label for="title" class="form-label">Expense Title / Item *</label>
                <input type="text" id="title" name="title" class="form-control" placeholder="e.g. Grocery Shopping, Metro Ticket, Electricity Bill" value="{{ title or '' }}" required autofocus>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="amount" class="form-label">Amount ({{ current_user.currency }}) *</label>
                    <input type="number" step="0.01" min="0.01" id="amount" name="amount" class="form-control" placeholder="0.00" value="{{ amount or '' }}" required>
                </div>

                <div class="form-group">
                    <label for="date" class="form-label">Date *</label>
                    <input type="date" id="date" name="date" class="form-control" value="{{ date or default_date }}" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="category" class="form-label">Category *</label>
                    <select id="category" name="category" class="form-select" required>
                        <option value="" disabled {% if not category %}selected{% endif %}>Select Category</option>
                        {% for cat in CATEGORIES %}
                            <option value="{{ cat }}" {% if category == cat %}selected{% endif %}>{{ cat }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="payment_method" class="form-label">Payment Method</label>
                    <select id="payment_method" name="payment_method" class="form-select">
                        {% for pm in PAYMENT_METHODS %}
                            <option value="{{ pm }}" {% if payment_method == pm %}selected{% endif %}>{{ pm }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="tags" class="form-label">Tags</label>
                <input type="text" id="tags" name="tags" class="form-control" placeholder="e.g. work, personal, recurring, tax (comma separated)" value="{{ tags or '' }}">
                <div class="form-text">Optional keywords separated by commas to help filter later.</div>
            </div>

            <div class="form-group">
                <label for="notes" class="form-label">Notes & Remarks</label>
                <textarea id="notes" name="notes" class="form-control" rows="3" placeholder="Add any details, receipt notes, location, or split info...">{{ notes or '' }}</textarea>
            </div>

            <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                <button type="submit" class="btn btn-primary" style="flex: 2;">Save Expense</button>
                <a href="{{ url_for('expense_list') }}" class="btn btn-outline" style="flex: 1;">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

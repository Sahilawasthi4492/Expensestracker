{% extends 'base.html' %}

{% block title %}Edit Expense - Personal Expense Tracker{% endblock %}

{% block content %}
<div class="container container-sm">
    <div style="margin-bottom: 1rem;">
        <a href="{{ url_for('expense_list') }}" style="font-size: 0.9rem; color: var(--gray-600);">&larr; Back to Expenses</a>
    </div>

    <div class="card">
        <div class="card-header">
            <h2 class="card-title">✏️ Edit Expense #{{ expense.id }}</h2>
        </div>

        <form method="POST" action="{{ url_for('edit_expense_route', expense_id=expense.id) }}">
            <div class="form-group">
                <label for="title" class="form-label">Expense Title / Item *</label>
                <input type="text" id="title" name="title" class="form-control" value="{{ expense.title }}" required autofocus>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="amount" class="form-label">Amount ({{ current_user.currency }}) *</label>
                    <input type="number" step="0.01" min="0.01" id="amount" name="amount" class="form-control" value="{{ "%.2f"|format(expense.amount) }}" required>
                </div>

                <div class="form-group">
                    <label for="date" class="form-label">Date *</label>
                    <input type="date" id="date" name="date" class="form-control" value="{{ expense.date }}" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="category" class="form-label">Category *</label>
                    <select id="category" name="category" class="form-select" required>
                        {% for cat in CATEGORIES %}
                            <option value="{{ cat }}" {% if expense.category == cat %}selected{% endif %}>{{ cat }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="payment_method" class="form-label">Payment Method</label>
                    <select id="payment_method" name="payment_method" class="form-select">
                        {% for pm in PAYMENT_METHODS %}
                            <option value="{{ pm }}" {% if expense.payment_method == pm %}selected{% endif %}>{{ pm }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="tags" class="form-label">Tags</label>
                <input type="text" id="tags" name="tags" class="form-control" value="{{ tags_str }}" placeholder="e.g. work, personal, recurring">
                <div class="form-text">Comma-separated tags</div>
            </div>

            <div class="form-group">
                <label for="notes" class="form-label">Notes & Remarks</label>
                <textarea id="notes" name="notes" class="form-control" rows="3">{{ expense.notes }}</textarea>
            </div>

            <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                <button type="submit" class="btn btn-primary" style="flex: 2;">Update Expense</button>
                <a href="{{ url_for('expense_list') }}" class="btn btn-outline" style="flex: 1;">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

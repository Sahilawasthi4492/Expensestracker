{% extends 'base.html' %}

{% block title %}Page Not Found - 404{% endblock %}

{% block content %}
<div style="text-align: center; padding: 4rem 1rem;">
    <div style="font-size: 4rem; margin-bottom: 1rem;">🔍</div>
    <h1 style="font-size: 2.25rem; font-weight: 800; color: var(--gray-900); margin-bottom: 0.75rem;">404 - Page Not Found</h1>
    <p style="color: var(--gray-600); max-width: 500px; margin: 0 auto 1.75rem auto;">
        The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
    </p>
    <a href="{{ url_for('index') }}" class="btn btn-primary">Return to Homepage</a>
</div>
{% endblock %}
